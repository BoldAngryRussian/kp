spring:
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  datasource:
    # URL, логин и пароль будут переопределены Testcontainers через DynamicPropertySource
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
